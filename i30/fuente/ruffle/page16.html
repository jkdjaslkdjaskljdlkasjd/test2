<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}#c{width:100vw;height:100vh}</style></head>
<body><div id="c"></div>
<script src="/ruffle/package/ruffle.js"></script>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {autoplay: "on", unmuteOverlay: "hidden", splashScreen: false, letterbox: "off", allowScriptAccess: true, logLevel: "warn", openUrlMode: "deny", backgroundColor: "#000000", scale: "showAll", forceScale: true, quality: "high"};
const ruffle = window.RufflePlayer.newest();
const player = ruffle.createPlayer();
player.style.width = "100%"; player.style.height = "100%";
document.getElementById("c").appendChild(player);
const swf = new URLSearchParams(location.search).get("swf");
window.__player = player;
player.load({url: swf, allowScriptAccess: true});
</script></body></html>
